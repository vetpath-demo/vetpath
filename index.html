<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetPath Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
   .hdr>.topo{position:absolute}
/* VOICE: energetic but steady: a mission app for people who've done real missions
   IDEA: a field map and dog tag: topographic lines, night-vision lime, rank chevrons earned as you go
   PICTURE: the phone app itself, glowing on a night topo map, with a dog-tag ID card and progress ring
   COLOUR and TYPE: near-black olive field, night-vision lime action, khaki sand support; Archivo + Inter, Space Mono on the tag
   LAYOUT: phone frame centered with a short caption on wide screens; full-screen app on phones */
:root{color-scheme:dark;--bg:#0c100e;--bg2:#141a16;--card:#18201b;--line:#26302a;--ink:#f3f5ee;--muted:#8e978f;--lime:#c6ff3d;--sand:#d8c8a0;--dim:#35423a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Arial,sans-serif;font-weight:800;margin:0;line-height:1.08}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;min-height:100vh;display:flex;gap:64px;align-items:center;justify-content:center;padding:32px 16px;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 80% 10%,rgba(198,255,61,.16),transparent 70%),radial-gradient(40% 50% at 5% 100%,rgba(216,200,160,.10),transparent 70%);pointer-events:none}
.side{position:relative;z-index:1;max-width:330px}
.side h1{font-size:52px;display:flex;align-items:center;gap:14px}
.side p{color:var(--muted)}
.kick{color:var(--lime);font-weight:700;font-size:13px;letter-spacing:.06em;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.phone{position:relative;z-index:1;width:390px;height:812px;border-radius:46px;background:#050705;padding:11px;box-shadow:0 0 0 1px #26302a,0 30px 80px rgba(0,0,0,.6),0 0 80px rgba(198,255,61,.12);flex:none}
.app{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.scr{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 22px;scrollbar-width:none}
.scr>.in{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hdr{position:relative;margin:0 -18px 16px;padding:30px 22px 22px;background:linear-gradient(180deg,#141a16,#0c100e);overflow:hidden;border-bottom:1px solid var(--line)}
.hdr>*{position:relative}
.hdr small{color:var(--lime);font-weight:700;font-size:12px;letter-spacing:.06em}
.hdr h2{font-size:28px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:16px;background:var(--lime);color:#0c100e;font-weight:700;transition:transform .12s,box-shadow .2s;box-shadow:0 0 0 rgba(198,255,61,0)}
.btn:hover{box-shadow:0 0 24px rgba(198,255,61,.35)}
.btn:active,.opt:active,.chk:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--lime);border:1.5px solid var(--lime)}
.btn.sm{width:auto;min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.row{display:flex;align-items:center;gap:12px}
.ring{width:92px;height:92px;flex:none}
.tag{position:relative;border-radius:30px 30px 30px 30px/38px 38px 38px 38px;padding:18px 20px 16px 22px;color:#1e2620;background:linear-gradient(135deg,#eef1ea 0%,#a3aba1 45%,#dfe3da 70%,#868f86 100%);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 #fff;font-family:"Space Mono",monospace;font-size:13px;line-height:1.5;margin-bottom:12px;transform:rotate(-1.2deg)}
.tag b{font-size:20px;display:block;letter-spacing:.04em}
.tag .hole{position:absolute;right:18px;top:16px;width:14px;height:14px;border-radius:50%;background:#0c100e;box-shadow:inset 0 0 0 2px #6b736a}
.tag .emb{position:absolute;inset:8px;border-radius:24px;border:1.5px solid rgba(60,70,62,.35);pointer-events:none}
.rank{display:flex;align-items:center;gap:14px}
.rank svg{width:46px;height:46px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--dim);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);box-shadow:0 0 12px var(--lime);transition:width .5s}
nav{display:flex;border-top:1px solid var(--line);background:#0f1411;padding:6px 6px 14px}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;padding:8px 2px;border-radius:14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;transition:color .2s}
nav button.on{color:var(--lime);font-weight:700}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(198,255,61,.7))}
nav svg{width:22px;height:22px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--dim);background:none;flex:none;display:grid;place-items:center;padding:0;transition:.2s}
.chk.done{background:var(--lime);border-color:var(--lime);color:#0c100e;box-shadow:0 0 14px rgba(198,255,61,.5)}
.task.done b{text-decoration:line-through;color:var(--muted)}
.task details{font-size:14px;color:var(--muted);margin-top:4px}
.task summary{cursor:pointer;color:var(--sand);font-weight:600;min-height:24px}
.num{font-family:Archivo;font-weight:800;color:var(--sand);font-size:13px;width:22px;flex:none;padding-top:5px}
.pill{display:inline-block;padding:7px 13px;border-radius:99px;border:1px solid var(--dim);color:var(--ink);font-size:13px;font-weight:600;margin:0 6px 6px 0;background:#121813}
.pill.on{border-color:var(--lime);color:var(--lime)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:50px;transition:.15s}
.opt.on{border-color:var(--lime);background:#1c2614;box-shadow:0 0 0 3px rgba(198,255,61,.12)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--dim);flex:none}
.opt.on .dot{border:5px solid var(--lime)}
label{font-weight:600;font-size:14px;display:block;margin:14px 0 6px;color:var(--sand)}
input,select{width:100%;font:16px Inter,sans-serif;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:50px}
.av{width:50px;height:50px;border-radius:16px;background:var(--sand);color:#0c100e;display:grid;place-items:center;font-weight:800;font-family:Archivo;flex:none}
.date{width:54px;text-align:center;flex:none;border-radius:14px;border:1px solid var(--dim);color:var(--lime);padding:6px 0;font-family:Archivo;font-weight:800;font-size:20px;line-height:1.05}
.date small{display:block;font-size:11px;color:var(--sand)}
.toast{position:absolute;left:18px;right:18px;bottom:92px;background:var(--lime);color:#0c100e;font-weight:700;border-radius:14px;padding:12px 16px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:5;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:none}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fxs{position:absolute;width:14px;height:14px;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg);opacity:0}}
.lvl{position:absolute;inset:0;z-index:7;background:rgba(5,7,5,.82);display:grid;place-items:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:.3s}
.lvl.show{opacity:1;pointer-events:auto}
.lvl .badge{width:120px;height:120px;margin:0 auto 14px;animation:spin .8s ease}
@keyframes spin{from{transform:scale(.3) rotate(-30deg)}to{transform:none}}
.splash{position:relative;margin:0 -18px;padding:52px 22px 24px;overflow:hidden}
.splash h2{font-size:44px}
.splash p{color:var(--muted);margin:10px 0 0}
.glow{position:absolute;width:260px;height:260px;right:-80px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(198,255,61,.35),transparent 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
@media(max-width:860px){.side{display:none}.stage{padding:0}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}.app{border-radius:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <svg class="topo" id="bgtopo" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 900" aria-hidden="true"></svg>
  <div class="side">
    <div class="kick"><svg width="14" height="14" viewBox="0 0 100 100"><path fill="#c6ff3d" d="M50 4l13.5 29.5 32 3.5-24 21.5 7 31.5L50 74 21.5 90l7-31.5-24-21.5 32-3.5z"/></svg>IS 330 · Group 10 prototype</div>
    <h1><span id="logoBig"></span>VetPath</h1>
    <p>Your first semester at UNLV, run like a mission. One checklist for VA benefits paperwork, plain-language benefit help, and a squad of student vets.</p>
    <p class="muted">Tap through the phone: complete objectives to earn rank. Progress is remembered on this device.</p>
  </div>
  <div class="phone"><div class="app" id="app">
    <div class="scr" id="scr"></div>
    <nav id="nav" hidden>
      <button data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3.5V11c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V5.5z"/></svg>Base</button>
      <button data-t="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>Objectives</button>
      <button data-t="benefits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 11h8M8 15h6"/></svg>Intel</button>
      <button data-t="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.2 4.4 2 5 4.5"/></svg>Squad</button>
    </nav>
    <div id="fx"></div>
    <div class="lvl" id="lvl"></div>
    <div class="toast" id="toast"></div>
  </div></div>
</div>
<script>
{
const STAR="M50 4l13.5 29.5 32 3.5-24 21.5 7 31.5L50 74 21.5 90l7-31.5-24-21.5 32-3.5z";
const LOGO=(s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 3 92 20v30c0 24-18 40-42 47C26 90 8 74 8 50V20z" fill="#c6ff3d"/><g transform="translate(25 22) scale(.5)"><path d="${STAR}" fill="#0c100e"/></g><path d="M24 72l26 12 26-12" fill="none" stroke="#0c100e" stroke-width="6" stroke-linejoin="round"/></svg>`;
function topo(seed,cx,cy,n,op){let o="";for(let k=1;k<=n;k++){const r0=k*58;let d="";for(let a=0;a<=72;a++){const t=a/72*Math.PI*2,r=r0*(1+.18*Math.sin(3*t+seed+k*.3)+.1*Math.sin(5*t+seed*2)+.06*Math.sin(7*t+k));d+=(a?"L":"M")+(cx+r*Math.cos(t)*1.25).toFixed(1)+" "+(cy+r*Math.sin(t)*.9).toFixed(1)}o+=`<path d="${d}Z" fill="none" stroke="#c6ff3d" stroke-opacity="${(op-k*.004).toFixed(3)}" stroke-width="1.6"/>`}return o}
document.getElementById("bgtopo").innerHTML=topo(1,1300,180,16,.11)+topo(4,150,820,10,.07);
document.getElementById("logoBig").innerHTML=LOGO(52);
const hdrTopo=seed=>`<svg class="topo" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${topo(seed,330,30,9,.16).replace(/stroke-width="1.6"/g,'stroke-width="1"').replace(/(\d+\.\d) (\-?\d+\.\d)/g,(m,a,b)=>m)}</svg>`;
const chev=n=>{let p="";for(let i=0;i<4;i++)p+=`<path d="M10 ${78-i*20}l40-18 40 18" fill="none" stroke="${i<n?"#c6ff3d":"#35423a"}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`;return `<svg viewBox="0 0 100 100" aria-hidden="true">${p}</svg>`};
const RANKS=[{min:0,n:"Recruit",c:0},{min:2,n:"Private",c:1},{min:4,n:"Specialist",c:2},{min:6,n:"Squad Leader",c:3},{min:8,n:"Mission Complete",c:4}];
const rankOf=d=>RANKS.filter(r=>d>=r.min).pop();
const TASKS=[
 {t:"Apply for your VA education benefit",w:"Apply online with the VA. If approved, your Certificate of Eligibility (COE) usually arrives in about 30 days.",where:"VA.gov"},
 {t:"Send your COE to the MVSC",w:"Forward a copy of your Certificate of Eligibility to UNLV's Military & Veteran Services Center. Using VR&E (Chapter 31)? Send VA Form 22-1905 from your counselor instead.",where:"MVSC · Student Services Complex A, Room 311"},
 {t:"Send your DD-214 (Member 4 copy)",w:"The MVSC also needs your DD-214 Member 4 copy on file.",where:"MVSC"},
 {t:"Enroll in at least one class",w:"You have to be enrolled in a class before you can request VA certification.",where:"MyUNLV"},
 {t:"Request VA certification in MyUNLV",w:"Do this every semester you use VA benefits. If you add or drop classes later, submit an update so the MVSC can fix your file.",where:"MyUNLV · Certification Request"},
 {t:"Attend military & veteran orientation",w:"Learn the programs and services set up to support you at UNLV.",where:"UNLV Orientation"},
 {t:"Check your MyUNLV To Do List",w:"Watch your To Do List and Communication Center regularly for notices about your enrollment.",where:"MyUNLV"},
 {t:"Connect with Rebel Vets",w:"UNLV's student veteran organization: the fastest way to meet people who've made the same move.",where:"Squad tab"}
];
const CH={
 "33":{n:"Chapter 33 · Post-9/11 GI Bill",d:["Certificate of Eligibility","DD-214 Member 4 copy","Certification request each semester"]},
 "30":{n:"Chapter 30 · Montgomery GI Bill (Active Duty)",d:["Certificate of Eligibility","DD-214 Member 4 copy","Certification request each semester"]},
 "31":{n:"Chapter 31 · Veteran Readiness & Employment",d:["VA Form 22-1905 from your VR&E counselor","DD-214 Member 4 copy","Certification request each semester"]},
 "35":{n:"Chapter 35 · Dependents' Educational Assistance",d:["Certificate of Eligibility","Certification request each semester"]},
 "1606":{n:"Chapter 1606 · Selected Reserve",d:["Certificate of Eligibility","Certification request each semester"]}
};
const BR=["Army","Navy","Air Force","Marine Corps","Coast Guard","Space Force"];
const store={get(k,d){try{const v=localStorage.getItem("vp2_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("vp2_"+k,JSON.stringify(v))}catch(e){}}};
let S={profile:store.get("profile",null),done:store.get("done",[1,0,0,0,0,0,0,0]),tab:"home",ob:{status:"Veteran",ch:"33",name:"Jordan",br:"Army"},rsvp:store.get("rsvp",[]),join:store.get("join",["Rebel Vets"])};
const scr=document.getElementById("scr"),nav=document.getElementById("nav"),toastEl=document.getElementById("toast"),fx=document.getElementById("fx"),lvl=document.getElementById("lvl");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cnt=()=>S.done.filter(Boolean).length,pct=()=>Math.round(cnt()/TASKS.length*100);
const starSvg=c=>`<svg viewBox="0 0 100 100" width="14" height="14"><path d="${STAR}" fill="${c}"/></svg>`;
let tt;function toast(m){toastEl.innerHTML=starSvg("#0c100e")+esc(m);toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800)}
function burst(el){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const a=document.getElementById("app").getBoundingClientRect(),r=el?el.getBoundingClientRect():{left:a.left+a.width/2,top:a.top+a.height/2,width:0,height:0};const x=r.left-a.left+r.width/2,y=r.top-a.top+r.height/2;for(let i=0;i<14;i++){const s=document.createElement("div");s.className="fxs";s.innerHTML=`<svg viewBox="0 0 100 100" width="14" height="14"><path d="${STAR}" fill="${i%3?"#c6ff3d":"#d8c8a0"}"/></svg>`;const ang=Math.random()*Math.PI*2,dist=50+Math.random()*70;s.style.left=x-7+"px";s.style.top=y-7+"px";s.style.setProperty("--dx",Math.cos(ang)*dist+"px");s.style.setProperty("--dy",Math.sin(ang)*dist+"px");fx.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function levelUp(r){lvl.innerHTML=`<div><div class="badge">${chev(r.c)}</div><div style="color:var(--lime);font-weight:700;font-size:13px;letter-spacing:.06em">RANK UP</div><h2 style="font-size:34px;margin:6px 0 10px">${r.n}</h2><p class="muted" style="margin:0 0 18px">${r.c==4?"Every first-semester objective is done. Outstanding work.":"Keep going. Next rank unlocks with more objectives."}</p><button class="btn" id="lvlok">Continue</button></div>`;lvl.classList.add("show");burst(lvl.querySelector(".badge"))}
lvl.addEventListener("click",e=>{if(e.target.id=="lvlok")lvl.classList.remove("show")});
const ring=p=>{const r=38,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#26302a" stroke-width="8"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="#c6ff3d" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 46 46)" style="transition:stroke-dashoffset .6s;filter:drop-shadow(0 0 5px rgba(198,255,61,.6))"/><text x="46" y="53" text-anchor="middle" fill="#f3f5ee" font-family="Archivo" font-weight="800" font-size="21">${p}%</text></svg>`};
function onboarding(){
 const o=S.ob;
 return `<div class="in"><div class="splash"><div class="glow"></div>${hdrTopo(2)}<div style="position:relative">${LOGO(56)}<div style="color:var(--lime);font-weight:700;font-size:12px;letter-spacing:.06em;margin-top:18px">MISSION: FIRST SEMESTER</div><h2>VetPath</h2><p>From service to campus, one objective at a time.</p></div></div>
 <form id="obf">
 <label for="nm">Name on your tag</label><input id="nm" value="${esc(o.name)}" autocomplete="given-name">
 <label>I am a…</label>${["Veteran","Active duty","Guard / Reserve","Military family member"].map(s=>`<button type="button" class="opt ${o.status==s?"on":""}" data-st="${s}"><span class="dot"></span>${s}</button>`).join("")}
 <label for="br">Branch</label><select id="br">${BR.map(b=>`<option ${o.br==b?"selected":""}>${b}</option>`).join("")}</select>
 <label for="ch">VA benefit I'm using</label><select id="ch">${Object.entries(CH).map(([k,v])=>`<option value="${k}" ${o.ch==k?"selected":""}>${v.n}</option>`).join("")}</select>
 <button class="btn" style="margin-top:18px">Start my mission ${starSvg("#0c100e")}</button></form>
 <p class="note">Prototype · names, mentors and events are sample content</p></div>`;
}
function home(){
 const p=S.profile,n=S.done.indexOf(0),next=n<0?null:TASKS[n],r=rankOf(cnt()),nr=RANKS.find(x=>x.min>cnt());
 return `<div class="in"><div class="hdr">${hdrTopo(3)}<small>BASE · ${esc(p.status.toUpperCase())}</small><h2>Welcome back, ${esc(p.name)}</h2>
 <div class="row" style="margin-top:16px">${ring(pct())}<div><b style="font-size:18px">${cnt()} of ${TASKS.length} objectives</b><div class="muted">${pct()==100?"Mission complete for this semester.":"You're on track. Keep moving."}</div></div></div></div>
 <div class="tag"><span class="emb"></span><span class="hole"></span><b>${esc(p.name.toUpperCase())}</b>${esc(p.br.toUpperCase())} · ${esc(p.status.toUpperCase())}<br>${CH[p.ch].n.split(" · ")[0].toUpperCase()}<br>UNLV · CLASS OF FALL 2026</div>
 <div class="card rank">${chev(r.c)}<div style="flex:1"><div class="muted">Current rank</div><b style="font-size:18px">${r.n}</b>${nr?`<div class="bar" style="margin-top:8px"><i style="width:${(cnt()-r.min)/(nr.min-r.min)*100}%"></i></div><div class="muted" style="font-size:12px;margin-top:4px">${nr.min-cnt()} to ${nr.n}</div>`:""}</div></div>
 ${next?`<div class="card" style="border-color:#3d4a1f"><div style="color:var(--lime);font-weight:700;font-size:12px;letter-spacing:.06em">NEXT OBJECTIVE</div><h3 style="font-size:20px;margin:6px 0">${next.t}</h3><p class="muted" style="margin:0 0 12px">${next.w}</p><button class="btn" data-do="${n}">Mark complete ${starSvg("#0c100e")}</button></div>`:`<div class="card"><h3>All objectives complete</h3><p class="muted">Remember: request certification again next semester.</p></div>`}
 <div class="card"><div class="row"><div class="av">MV</div><div><b>Military & Veteran Services Center</b><div class="muted">Student Services Complex A, Room 311</div></div></div></div></div>`;
}
function tasks(){
 return `<div class="in"><div class="hdr">${hdrTopo(5)}<small>OBJECTIVES</small><h2>First-semester mission</h2><div class="bar" style="margin-top:14px"><i style="width:${pct()}%"></i></div><div class="muted" style="margin-top:6px">${pct()}% complete · rank: ${rankOf(cnt()).n}</div></div>
 <div class="card">${TASKS.map((k,i)=>`<div class="task ${S.done[i]?"done":""}"><span class="num">${String(i+1).padStart(2,"0")}</span><div style="flex:1"><b>${k.t}</b><details><summary>Intel: why & where</summary>${k.w}<br><span style="color:var(--lime)">${k.where}</span></details></div><button class="chk ${S.done[i]?"done":""}" data-tg="${i}" aria-label="${S.done[i]?"Mark not done":"Mark done"}: ${k.t}">${S.done[i]?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':""}</button></div>`).join("")}</div>
 <button class="btn ghost" id="reset">Reset mission</button></div>`;
}
function benefits(){
 const c=CH[S.profile.ch],[code,name]=c.n.split(" · ");
 return `<div class="in"><div class="hdr">${hdrTopo(6)}<small>INTEL · ${code.toUpperCase()}</small><h2>${name}</h2></div>
 <div class="card"><h3 style="font-size:18px;margin-bottom:8px">What the MVSC needs from you</h3>${c.d.map((d,i)=>`<div class="row" style="padding:7px 0;border-top:${i?"1px solid var(--line)":"0"}">${starSvg("#d8c8a0")}<span>${d}</span></div>`).join("")}</div>
 <div class="card"><h3 style="font-size:18px;margin-bottom:6px">How certification works</h3><p class="muted" style="margin:0">UNLV's VA certifying officials send your enrollment to the VA. You start it each semester with a Certification Request in MyUNLV, once you're enrolled in at least one class.</p></div>
 <div class="card"><label for="sw" style="margin-top:0">Switch benefit</label><select id="sw">${Object.entries(CH).map(([k,v])=>`<option value="${k}" ${S.profile.ch==k?"selected":""}>${v.n}</option>`).join("")}</select></div>
 <p class="note">Always confirm details with the MVSC. VetPath is a guide, not the official record.</p></div>`;
}
const EV=[{m:"DEC",d:"03",t:"Rebel Vets coffee hour",w:"Student Union · 10:00 AM"},{m:"DEC",d:"09",t:"Study night before finals",w:"Lied Library · 6:00 PM"},{m:"JAN",d:"21",t:"Spring welcome for new vets",w:"MVSC · 12:00 PM"}];
const GR=["Rebel Vets","Student parents","Business majors","Nellis AFB commuters","Post-9/11 vets"];
function connect(){
 return `<div class="in"><div class="hdr">${hdrTopo(7)}<small>SQUAD</small><h2>No one does this mission alone</h2></div>
 <div class="card"><div style="color:var(--lime);font-weight:700;font-size:12px;letter-spacing:.06em;margin-bottom:10px">YOUR PEER MENTOR</div><div class="row"><div class="av">AR</div><div style="flex:1"><b>Alex R.</b><div class="muted">Army veteran · Junior, Business</div></div>${chev(3).replace("<svg",'<svg width="34" height="34"')}</div><p class="muted" style="margin:10px 0 12px">"I started at UNLV after 6 years in. Ask me anything about benefits or classes."</p><button class="btn" id="msg">Say hi</button></div>
 <div class="card"><h3 style="font-size:18px;margin-bottom:10px">Upcoming ops</h3>${EV.map((e,i)=>`<div class="row" style="padding:9px 0;border-top:${i?"1px solid var(--line)":"0"}"><div class="date"><small>${e.m}</small>${e.d}</div><div style="flex:1"><b>${e.t}</b><div class="muted">${e.w}</div></div><button class="btn sm ${S.rsvp.includes(i)?"":"ghost"}" data-rs="${i}">${S.rsvp.includes(i)?"Going":"RSVP"}</button></div>`).join("")}</div>
 <div class="card"><h3 style="font-size:18px;margin-bottom:10px">Join a group</h3>${GR.map(g=>`<button class="pill ${S.join.includes(g)?"on":""}" data-gr="${g}">${S.join.includes(g)?"✓ ":"+ "}${g}</button>`).join("")}</div>
 <p class="note">Mentor, events and groups other than Rebel Vets are sample content</p></div>`;
}
const V={home,tasks,benefits,connect};
function render(){
 if(!S.profile){nav.hidden=true;scr.innerHTML=onboarding();return}
 nav.hidden=false;scr.innerHTML=V[S.tab]();
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t==S.tab));
}
function setDone(i,v,el){const before=rankOf(cnt());S.done[i]=v?1:0;store.set("done",S.done);render();if(v){burst(el);const after=rankOf(cnt());if(after.c>before.c)setTimeout(()=>levelUp(after),450);else toast("Objective complete")}}
scr.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.st){S.ob={status:b.dataset.st,name:document.getElementById("nm").value,ch:document.getElementById("ch").value,br:document.getElementById("br").value};render();return}
 if(b.dataset.do){setDone(+b.dataset.do,1,b);return}
 if(b.dataset.tg){const i=+b.dataset.tg;setDone(i,!S.done[i],b);return}
 if(b.dataset.rs){const i=+b.dataset.rs;S.rsvp=S.rsvp.includes(i)?S.rsvp.filter(x=>x!=i):[...S.rsvp,i];store.set("rsvp",S.rsvp);render();if(S.rsvp.includes(i))toast("You're on the list");return}
 if(b.dataset.gr){const g=b.dataset.gr;S.join=S.join.includes(g)?S.join.filter(x=>x!=g):[...S.join,g];store.set("join",S.join);render();if(S.join.includes(g))toast("Joined "+g);return}
 if(b.id=="reset"){S.done=TASKS.map(()=>0);store.set("done",S.done);render();toast("Mission reset");return}
 if(b.id=="msg"){toast("Message sent to Alex (demo)");return}
});
scr.addEventListener("submit",e=>{e.preventDefault();S.profile={name:document.getElementById("nm").value.trim()||"Recruit",status:S.ob.status,ch:document.getElementById("ch").value,br:document.getElementById("br").value};store.set("profile",S.profile);S.tab="home";render();burst();toast("Mission started")});
scr.addEventListener("change",e=>{if(e.target.id=="sw"){S.profile.ch=e.target.value;store.set("profile",S.profile);render()}});
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;render();scr.scrollTop=0}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&e.shiftKey){S.profile=null;store.set("profile",null);render()}});
render();
}
</script>
</body>
</html>
